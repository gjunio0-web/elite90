<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug — Upload de Fotos</title>
  <style>
    body { font-family: monospace; background: #0d0d0d; color: #ccc; padding: 32px; max-width: 560px; margin: 0 auto; }
    h1  { color: #A6C300; font-size: 1.2rem; margin-bottom: 4px; }
    p   { font-size: 13px; color: #666; margin: 0 0 24px; }
    label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
    input[type="file"] { display: block; color: #ccc; font-size: 13px; margin-bottom: 20px; }
    button { background: #A6C300; color: #000; border: none; padding: 10px 24px; cursor: pointer; font-weight: 700; font-size: 13px; letter-spacing: .05em; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #status { font-size: 13px; margin: 14px 0 0; min-height: 18px; }
    .ok  { color: #A6C300; }
    .err { color: #ff5555; }
    pre  { margin-top: 16px; background: #161616; padding: 14px; font-size: 11px; overflow: auto; border-left: 2px solid #333; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 24px; font-size: 11px; }
    td { padding: 3px 6px; border-bottom: 1px solid #1a1a1a; }
    td:first-child { color: #555; width: 45%; }
    td:last-child  { color: #aaa; }
  </style>
</head>
<body>

<h1>Debug — Upload de Fotos</h1>
<p>Campos pré-preenchidos. Selecione as fotos e clique em Enviar para testar o pipeline completo.</p>

<table>
  <tr><td>email</td><td>gjunio0@gmail.com</td></tr>
  <tr><td>peso / altura</td><td>100 kg / 1.8 m</td></tr>
  <tr><td>objetivo</td><td>Ganho de massa muscular</td></tr>
  <tr><td>competição</td><td>SIM — Men's Physique, 2024</td></tr>
  <tr><td>trt</td><td>SIM — Deca, dura e trembolona</td></tr>
</table>

<label>Nome do candidato</label>
<input type="text" id="nome" placeholder="Ex: Gonçalo Marques Moreira Jr" style="width:100%;background:#1a1a1a;border:1px solid #333;color:#ccc;padding:8px 10px;font-size:13px;font-family:monospace;margin-bottom:20px;box-sizing:border-box;">

<label>Fotos (até 5 imagens)</label>
<input type="file" id="fotos" accept="image/*" multiple>

<button id="btn" onclick="enviar()">Enviar para submit-lead</button>
<div id="status"></div>
<pre id="resultado" hidden></pre>

<script>
  const PAYLOAD = {
    email:                 "gjunio0@gmail.com",
    cpf:                   "213.327.288-71",
    data_nascimento:       "08/04/1978",
    altura:                "1.8",
    peso:                  "100",
    objetivo:              "Ganho de massa muscular",
    objetivo_outro:        "",
    atividade_fisica:      "Musculação",
    atividade_outra:       "",
    tempo_atividade:       "25",
    frequencia_semanal:    "5",
    disponibilidade_diaria:"2",
    personal_trainer:      "NÃO",
    competicao:            "SIM",
    competicao_detalhe:    "Men's Physique, 2024",
    conhece_coach:         "SIM",
    medico_esporte:        "SIM",
    trt:                   "SIM",
    trt_detalhe:           "Deca, dura e trembolona",
    condicao_cardiaca:     "Nenhuma",
    diabetes:              "NÃO",
    doenca_cronica:        "Nenhuma",
    lesao:                 "SIM",
    lesao_detalhe:         "Ombro esquerdo, sem cirurgia.",
    dieta:                 "Sim, com acompanhamento profissional",
    refeicoes_dia:         "6",
    suplementos:           "SIM",
    suplementos_detalhe:   "Whey protein, glutamina e creatina.",
    agua_litros:           "5",
    consentimento_saude:   "true",
  };

  async function toBase64(file) {
    return new Promise(resolve => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
          else        { w = Math.round(w * MAX / h); h = MAX; }
        }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/webp", 0.82).split(",")[1]);
      };
      img.src = url;
    });
  }

  async function enviar() {
    const btn    = document.getElementById("btn");
    const status = document.getElementById("status");
    const pre    = document.getElementById("resultado");
    const nome   = document.getElementById("nome").value.trim();
    const files  = Array.from(document.getElementById("fotos").files).slice(0, 5);

    if (!nome)        { status.textContent = "⚠ Informe o nome do candidato."; return; }
    if (!files.length) { status.textContent = "⚠ Selecione ao menos uma foto."; return; }

    btn.disabled = true;
    pre.hidden = true;
    status.className = "";

    const fotos_b64 = [];
    for (let i = 0; i < files.length; i++) {
      status.textContent = `Comprimindo ${i + 1}/${files.length}…`;
      fotos_b64.push(await toBase64(files[i]));
    }

    status.textContent = "Enviando…";

    try {
      const res = await fetch("/.netlify/functions/submit-lead", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ ...PAYLOAD, nome, fotos_b64, fotos_upload_id: `debug-${Date.now()}` }),
      });
      const txt = await res.text();
      pre.hidden = false;
      if (res.ok) {
        status.className = "ok";
        status.textContent = "✓ Sucesso — verifique fotos_paths no Firestore.";
        pre.style.borderLeftColor = "#A6C300";
        pre.textContent = `HTTP ${res.status}\n\n${txt}`;
      } else {
        status.className = "err";
        status.textContent = `✗ Erro HTTP ${res.status}`;
        pre.style.borderLeftColor = "#ff5555";
        pre.textContent = txt;
      }
    } catch (e) {
      status.className = "err";
      status.textContent = "✗ Exceção JavaScript";
      pre.style.borderLeftColor = "#ff5555";
      pre.textContent = (e.stack ?? e.message ?? String(e));
      pre.hidden = false;
    }

    btn.disabled = false;
  }
</script>

</body>
</html>
