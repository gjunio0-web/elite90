[build]
  command = "npm run build --workspace=apps/site"
  publish = "apps/site/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "progresso-guard"
  path = "/progresso*"

[functions."purge-rejected-leads"]
  schedule = "0 3 * * *"

# A cada 5 minutos, confere se alguma base de domínio (netlify/functions/
# _publicacao.ts) tem alteração pendente com pelo menos DEBOUNCE_MS de
# "silêncio" desde a última gravação, e aciona o build hook se sim. Ver o
# cabeçalho de publicar-bases-pendentes.ts para o desenho completo — inclusive
# por que o intervalo aqui casa com o DEBOUNCE_MS de lá.
[functions."publicar-bases-pendentes"]
  schedule = "*/5 * * * *"

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# 404 em ingles.
# O Astro emite a versao PT em 404.html na raiz da publicacao, e o Netlify a
# serve para qualquer endereco nao encontrado -- inclusive sob /en/, o que
# devolveria a pagina em portugues a um visitante em ingles. A versao em ingles
# e emitida em /en/404/index.html (o formato de diretorio do Astro), fora do
# lugar onde o Netlify procura sozinho. Esta regra cobre essa lacuna.
# Sem force: paginas reais sob /en/ continuam tendo precedencia sobre a regra.
[[redirects]]
  from = "/en/*"
  to = "/en/404/index.html"
  status = 404