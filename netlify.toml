[build]
  command = "npm run build --workspace=apps/site"
  publish = "apps/site/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "progresso-guard"
  path = "/progresso*"

[functions."purge-rejected-leads"]
  schedule = "0 3 * * *"

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200